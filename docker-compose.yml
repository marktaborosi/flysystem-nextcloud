# Local Nextcloud for the integration tests.
#
#   docker compose up -d --wait     # starts and waits until Nextcloud is installed
#   composer test:integration
#   docker compose down -v          # stop and wipe all data
#
# Uses the official image's built-in auto-installer with SQLite: no database
# container and no custom entrypoint needed.
services:
  nextcloud:
    image: nextcloud:${NEXTCLOUD_IMAGE_TAG:-stable-apache}
    ports:
      - "${NEXTCLOUD_HTTP_PORT:-8080}:80"
    environment:
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:-admin}
      NEXTCLOUD_TRUSTED_DOMAINS: localhost 127.0.0.1
    volumes:
      - nextcloud_data:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/status.php | grep -q '\"installed\":true'"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

volumes:
  nextcloud_data:
