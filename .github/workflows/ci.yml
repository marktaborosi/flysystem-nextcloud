name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - uses: ramsey/composer-install@v3

      - name: PHPStan
        run: composer analyse

  unit:
    name: Unit tests (PHP ${{ matrix.php }}, ${{ matrix.dependencies }} deps)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        dependencies: [highest]
        include:
          - php: '8.2'
            dependencies: lowest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: PHPUnit (unit)
        run: vendor/bin/phpunit --testsuite unit

  integration:
    name: Integration (Nextcloud ${{ matrix.nextcloud }}${{ matrix.redis && ', Redis' || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Without Redis Nextcloud assembles chunked uploads the classic way, with Redis it uses chunking v2.
          - nextcloud: production-apache
            redis: false
          - nextcloud: stable-apache
            redis: true
    env:
      NEXTCLOUD_IMAGE_TAG: ${{ matrix.nextcloud }}
      NEXTCLOUD_INTEGRATION_REQUIRED: '1'
      COMPOSE_FILE: ${{ matrix.redis && 'docker-compose.yml:docker-compose.redis.yml' || 'docker-compose.yml' }}
    steps:
      - uses: actions/checkout@v7

      - name: Start Nextcloud
        run: docker compose up -d --wait --wait-timeout 300

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: PHPUnit (integration)
        run: vendor/bin/phpunit --testsuite integration

      - name: Nextcloud logs
        if: failure()
        run: docker compose logs nextcloud

      - name: Stop Nextcloud
        if: always()
        run: docker compose down -v
